name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Install from the tap
        run: brew install --formula shoemoney/tap/squad
      - name: Smoke test
        run: |
          VERSION="$(brew ruby -e 'puts Formulary.factory("shoemoney/tap/squad").version')"
          test -n "$VERSION"
          echo "formula version: $VERSION"
          squad --version | grep -F "$VERSION"
          brew test shoemoney/tap/squad
          HOME="$(mktemp -d)" squad doctor || test $? -eq 1
